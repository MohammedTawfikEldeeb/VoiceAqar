<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صوت عقار — تجربة المحادثة النصية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 750px;
      height: 85vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      padding: 20px 30px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(to left, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .session-badge {
      font-size: 0.8rem;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      color: #a5b4fc;
    }

    .btn-reset {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: var(--danger);
    }

    /* Message area */
    .chat-messages {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chat-msg {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.98rem;
      position: relative;
      animation: fadeInUp 0.3s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-msg.user {
      align-self: flex-start;
      background: var(--primary);
      color: var(--text);
      border-top-left-radius: 4px;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .chat-msg.agent {
      align-self: flex-end;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text);
      border-top-right-radius: 4px;
    }

    .chat-msg .sender {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .chat-msg.user .sender {
      color: #c7d2fe;
    }

    /* Thinking State */
    .thinking-bubble {
      align-self: flex-end;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      padding: 14px 20px;
      border-radius: 18px;
      border-top-right-radius: 4px;
      display: none;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: dot-blink 1.4s infinite both;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-blink {
      0% { opacity: 0.2; }
      20% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    /* Footer / Input */
    .chat-footer {
      padding: 20px 30px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid var(--glass-border);
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .input-box {
      flex: 1;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px 20px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    .input-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
    }

    .btn-send {
      background: var(--primary);
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .btn-send:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px var(--primary-glow);
    }

    .btn-send:active {
      transform: translateY(1px);
    }

    /* Scrollbar */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="chat-header">
      <div>
        <h1>صوت عقار — تجربة المحادثة النصية</h1>
        <div id="sessionDisplay" class="session-badge" style="margin-top: 5px; display: inline-block;">جلسة نشطة</div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <input type="text" id="phoneInput" value="01012345678" style="background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 8px; padding: 6px 12px; color: var(--text); font-family: inherit; font-size: 0.9rem; width: 140px; text-align: center;" placeholder="رقم الهاتف">
        <button class="btn-reset" id="resetBtn">إعادة ضبط المكالمة</button>
      </div>
    </div>

    <!-- Message Area -->
    <div class="chat-messages" id="chatMessages">
      <div class="chat-msg agent">
        <div class="sender">صوت عقار</div>
        <div id="greetingText">أهلاً بك في صوت عقار يا فندم! كيف يمكنني مساعدتك اليوم في البحث عن عقارات في مصر؟ وممكن نتعرف باسم حضرتك الكريم؟</div>
      </div>
      
      <!-- Thinking bubble -->
      <div class="thinking-bubble" id="thinkingBubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-footer">
      <input type="text" class="input-box" id="messageInput" placeholder="اكتب رسالتك هنا للمطور وروبوت صوت عقار..." autocomplete="off">
      <button class="btn-send" id="sendBtn">إرسال</button>
    </div>
  </div>

  <script>
    // Optional shared secret from ?api_token= (server must set API_AUTH_TOKEN)
    const API_TOKEN = new URLSearchParams(location.search).get('api_token') || '';

    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');
    const sessionDisplay = document.getElementById('sessionDisplay');
    const thinkingBubble = document.getElementById('thinkingBubble');
    const phoneInput = document.getElementById('phoneInput');
    const greetingText = document.getElementById('greetingText');

    let sessionId = `web_text_${Date.now()}`;
    let currentUserId = '';

    sessionDisplay.innerText = `جلسة: ${sessionId}`;

    async function sendMessage() {
      const text = messageInput.value.trim();
      const phone = phoneInput.value.trim() || '01012345678';
      if (!text) return;

      // 1. Render user message
      appendMessage('user', text);
      messageInput.value = '';

      // 2. Render thinking bubble
      showThinking(true);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(API_TOKEN ? { 'x-api-token': API_TOKEN } : {}),
          },
          body: JSON.stringify({
            message: text,
            phoneNumber: phone,
            sessionId: sessionId
          })
        });

        const data = await response.json();
        
        // 3. Render agent response
        showThinking(false);
        if (data.reply) {
          appendMessage('agent', data.reply);
          if (data.userId) {
            currentUserId = data.userId;
          }
        } else if (data.error) {
          appendMessage('agent', `خطأ من السيرفر: ${data.error}`);
        }
      } catch (err) {
        showThinking(false);
        appendMessage('agent', `خطأ في الاتصال بالسيرفر: ${err.message}`);
      }
    }

    function appendMessage(role, text) {
      const senderText = role === 'user' ? 'العميل' : 'صوت عقار';
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-msg ${role}`;

      const senderDiv = document.createElement('div');
      senderDiv.className = 'sender';
      senderDiv.innerText = senderText;

      const contentDiv = document.createElement('div');
      contentDiv.innerText = text;

      msgDiv.appendChild(senderDiv);
      msgDiv.appendChild(contentDiv);

      // Insert before thinking bubble
      chatMessages.insertBefore(msgDiv, thinkingBubble);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showThinking(show) {
      thinkingBubble.style.display = show ? 'flex' : 'none';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function resetSession(force = false) {
      if (force || confirm('هل أنت متأكد من إنهاء جلسة المحادثة الحالية وإعادة ضبط الذاكرة المؤقتة؟')) {
        try {
          await fetch('/api/chat/end', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(API_TOKEN ? { 'x-api-token': API_TOKEN } : {}),
            },
            body: JSON.stringify({ sessionId, userId: currentUserId })
          });
        } catch(e) {}

        // Reset local session variables
        sessionId = `web_text_${Date.now()}`;
        sessionDisplay.innerText = `جلسة: ${sessionId}`;
        
        // Clean chat log except the welcome message
        const messages = Array.from(chatMessages.children);
        messages.forEach(msg => {
          if (msg !== thinkingBubble && !msg.classList.contains('agent') || msg === messages[0]) {
            // Keep the very first welcome message, remove the rest
            if (msg !== messages[0] && msg !== thinkingBubble) {
              msg.remove();
            }
          }
        });
      }
    }

    // Reset session automatically when the phone number changes to mock a new incoming call
    phoneInput.addEventListener('change', () => {
      resetSession(true);
    });

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    resetBtn.addEventListener('click', resetSession);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
