services:
  postgres:
    image: postgres:16-alpine
    container_name: maskan_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: maskan_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: maskan_redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    container_name: maskan_neo4j
    ports:
      - "7474:7474"   
      - "7687:7687"   
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  qdrantdata:
  neo4jdata: